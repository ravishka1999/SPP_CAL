<!DOCTYPE html>
<html>
<head>
    <title>Sun Energy SPP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
    <h2>☀ SUN ENERGY SPP ☀</h2>

    <label>Enter Current RU:</label>
    <input type="number" id="ru">

    <label>KW:</label>
    <input type="number" id="kw" value="222">

    <label>Operator:</label>
    <input type="text" id="operator" value="ravishka">

    <label>Labour:</label>
    <input type="text" id="labour" value="sundarraj">

    <label>EXP MVA:</label>
    <input type="text" id="mva" value="0000.0100">

    <button onclick="generate()">Generate</button>

    <h3>Output:</h3>
    <pre id="output"></pre>
    <h3>📊 History Table</h3>
<table border="1" width="100%" id="historyTable">
    <thead>
        <tr>
            <th>Date</th>
            <th>Current RU</th>
            <th>Units</th>
            <th>Total Units</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<h3>📈 Generation Graph</h3>
<canvas id="unitsChart"></canvas>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="script.js"></script>

</body>
</html>
