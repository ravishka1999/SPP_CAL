<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sun Energy SPP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">

    <div class="header">
        <h1>SUN ENERGY SPP</h1>
        <img src="logo.png" class="logo">
    </div>

    <div class="cards">
        <div class="card">
            <h4>Previous RU</h4>
            <p id="cardUnits">0</p>
        </div>
        <div class="card">
            <h4>Total Units</h4>
            <p id="cardTotal">0</p>
        </div>
        <div class="card">
            <h4>Units</h4>
            <p id="cardKW">0</p>
        </div>
    </div>

    <label>Enter Current RU:</label>
    <input type="number" id="ru">

    <label>KW:</label>
    <input type="number" id="kw" value="222">

    <label>Operator:</label>
<select id="operator">
    <option value="Ravishka">Ravishka</option>
    <option value="Eranga">Eranga</option>
    <option value="Pathum">Pathum</option>
</select>

<label>Labour:</label>
<select id="labour">
    <option value="Sundarraj">Sundarraj</option>
    <option value="Praveen">Praveen</option>
    <option value="K.praveen">K.praveen</option>
</select>
    <label>EXP MVA:</label>
    <input type="text" id="mva" value="0000.0100">

    <button onclick="generate()">Generate Message</button>



<button class="copy-btn" onclick="copyMessage()">
    Copy Message
</button>
<button class="delete-btn" onclick="deleteLastRecord()">
    Delete Last Record
</button>

    <h3>System Output</h3>
    <pre id="output"></pre>

</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="script.js"></script>

</body>

</html>
